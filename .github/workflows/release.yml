name: build

# Builds ready-to-run binaries.
# - Every push to main and manual runs: downloadable workflow artifacts.
# - Tags v*: additionally published as a GitHub Release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: uad.exe
            # Static CRT: the .exe runs without the Visual C++ Redistributable.
            rustflags: -C target-feature=+crt-static
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: uad
            rustflags: ""
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
      # rustup installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup show active-toolchain || rustup toolchain install
      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked -p uad-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="uad-${GITHUB_REF_NAME//\//-}-${{ matrix.name }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" "dist/$name/"
          cp README.md LICENSE uad.example.toml "dist/$name/"
          cp -r docs "dist/$name/"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
            sha256sum "$name.zip" > "$name.zip.sha256"
          else
            tar -czf "$name.tar.gz" "$name"
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
          sha256sum "$name/${{ matrix.exe }}"
          echo "PKG_NAME=$name" >> "$GITHUB_ENV"
      - name: Smoke test
        shell: bash
        run: |
          "dist/$PKG_NAME/${{ matrix.exe }}" --version
          "dist/$PKG_NAME/${{ matrix.exe }}" analyze crates/uad-apk/tests/fixtures/rsa_v1v2v3.apk
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.zip
            dist/*.tar.gz
            dist/${{ env.PKG_NAME }}/${{ matrix.exe }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
